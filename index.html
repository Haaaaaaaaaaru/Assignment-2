<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haru's Kitchen Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- トップ画像（スクロールでゆっくり動く） -->
    <header class="hero">
        <div class="hero-image">
            <img src="./media/boroneze.jpeg" alt="">
        </div>
        <div class="hero-text">
            <h1>Haru's Kitchen Timer</h1>
            <p>料理を選んで、工程ごとにタイマーをスタート</p>
        </div>
    </header>

    <main>
        <!-- 料理を選ぶエリア -->
        <section id="menu">
            <h2 class="fade-in">1. 料理を選ぶ</h2>
            <div id="dish-list"></div>
        </section>

        <!-- タイマーのエリア（料理を選ぶと表示される） -->
        <section id="timer" hidden>
            <h2 class="fade-in">2. 工程ごとにタイマー</h2>
            <div class="timer-layout">
                <div class="timer-main fade-in">
                    <img id="dish-image" src="" alt="">
                    <p id="dish-name"></p>
                    <p id="step-count"></p>
                    <p id="step-name"></p>
                    <p id="time-display">00:00</p>
                    <div class="progress">
                        <div id="progress-bar"></div>
                    </div>
                    <p id="message"></p>
                    <div class="buttons">
                        <button id="start-button">スタート</button>
                        <button id="next-button">次の工程へ</button>
                        <button id="reset-button">最初から</button>
                    </div>
                    <label class="demo">
                        <input type="checkbox" id="demo-mode">
                        デモモード（1分を1秒で進める）
                    </label>
                </div>

                <!-- 工程の一覧 -->
                <div class="steps fade-in">
                    <h3>工程</h3>
                    <ol id="step-list"></ol>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <span>© 2026 Haru Okabe</span>
    </footer>

    <script src="effects.js"></script>
    <script src="timer.js"></script>
</body>
</html>
